<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1A1A99"/>
      <stop offset="100%" stop-color="#000080"/>
    </radialGradient>

    <linearGradient id="pinkRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0B7C9"/>
      <stop offset="55%" stop-color="#D57896"/>
      <stop offset="100%" stop-color="#91445E"/>
    </linearGradient>

    <linearGradient id="mintRibbon" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A6E7D2"/>
      <stop offset="55%" stop-color="#78D5B7"/>
      <stop offset="100%" stop-color="#4CA88D"/>
    </linearGradient>

    <linearGradient id="burgundyRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#91445E"/>
      <stop offset="100%" stop-color="#D57896"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>

    <clipPath id="badgeClip">
      <circle cx="512" cy="512" r="472"/>
    </clipPath>
  </defs>

  <!-- Fondo transparente fuera del icono -->
  <circle cx="512" cy="512" r="472" fill="url(#bg)"/>

  <g clip-path="url(#badgeClip)">
    <!-- Tarjeta de alumnado -->
    <g filter="url(#softShadow)">
      <rect x="292" y="122" width="440" height="610" rx="48" fill="#FFFFFF"/>
    </g>

    <!-- Filas de alumnado: iconos y líneas sin texto legible -->
    <g>
      <!-- fila 1 -->
      <circle cx="394" cy="205" r="28" fill="#91445E"/>
      <path d="M350 278c3-31 22-47 44-47s41 16 44 47z" fill="#91445E"/>
      <rect x="458" y="212" width="220" height="28" rx="14" fill="#91445E"/>

      <!-- fila 2 -->
      <circle cx="394" cy="326" r="28" fill="#F0B7C9"/>
      <path d="M350 399c3-31 22-47 44-47s41 16 44 47z" fill="#F0B7C9"/>
      <rect x="458" y="333" width="220" height="28" rx="14" fill="#D57896" opacity="0.76"/>

      <!-- fila 3 -->
      <circle cx="394" cy="447" r="28" fill="#D57896"/>
      <path d="M350 520c3-31 22-47 44-47s41 16 44 47z" fill="#D57896"/>
      <rect x="458" y="454" width="220" height="28" rx="14" fill="#D57896"/>

      <!-- fila 4 -->
      <circle cx="394" cy="568" r="28" fill="#91445E"/>
      <path d="M350 641c3-31 22-47 44-47s41 16 44 47z" fill="#91445E"/>
      <rect x="458" y="575" width="220" height="28" rx="14" fill="#91445E"/>
    </g>

    <!-- Möbius, banda trasera -->
    <path d="M138 378
             C220 250 384 250 522 348
             C662 448 764 364 858 300
             C962 229 1005 330 953 433
             C889 559 742 595 598 544
             C464 496 370 398 251 414
             C197 421 161 411 138 378Z"
          fill="url(#burgundyRibbon)" opacity="0.98"/>

    <!-- Möbius, tramo menta -->
    <path d="M91 451
             C75 532 111 650 184 708
             C263 771 359 700 444 620
             C538 531 621 421 731 382
             C834 345 936 367 970 447
             C1000 518 957 642 864 692
             C763 746 654 700 562 638
             C453 565 380 498 289 495
             C206 493 146 532 120 587
             C91 538 82 493 91 451Z"
          fill="url(#mintRibbon)"/>

    <!-- Möbius, banda frontal rosa -->
    <path d="M103 337
             C148 297 213 285 270 300
             C335 317 373 377 428 430
             C516 515 621 619 747 628
             C831 634 903 606 956 548
             C954 642 914 723 844 772
             C746 840 617 792 520 733
             C425 675 347 594 267 549
             C188 505 114 471 77 420
             C62 399 73 365 103 337Z"
          fill="url(#pinkRibbon)"/>

    <!-- Pliegue central oscuro para reforzar la lectura Möbius -->
    <path d="M363 671
             C434 619 489 570 541 521
             C571 493 607 455 638 442
             C663 432 681 443 675 465
             C655 535 591 604 512 670
             C457 716 407 746 363 752Z"
          fill="#91445E" opacity="0.84"/>

    <!-- Resalte superior de la cinta -->
    <path d="M112 349
             C182 302 252 309 304 347
             C339 372 373 414 408 448"
          fill="none" stroke="#F0B7C9" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Borde muy sutil del badge -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="#000080" stroke-width="6"/>
</svg>
