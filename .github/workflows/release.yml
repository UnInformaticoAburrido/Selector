name: Test and release Selector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem instaladores/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Test Windows installation and GUI
        if: runner.os == 'Windows'
        run: python instaladores/smoke_test.py
      - name: Test Linux installation and GUI
        if: runner.os == 'Linux'
        run: |
          bash -n install-linux.sh
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python instaladores/smoke_test.py

  release:
    timeout-minutes: 10
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build installer packages
        run: python instaladores/package.py
      - name: Publish a new version only once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Version ${version} is already published; existing releases are not overwritten."
            exit 0
          fi
          gh release create "v${version}" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Selector Moebius ${version}" \
            --notes-file RELEASE_NOTES.md --latest
