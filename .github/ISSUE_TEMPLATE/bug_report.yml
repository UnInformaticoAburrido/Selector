name: Reportar un error
description: Comunica un fallo en Selector de alumnos.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Describe el problema sin incluir listas ni nombres reales de alumnos."
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué ha ocurrido?
      description: Explica qué esperabas y qué ocurrió realmente.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abrir la aplicación…"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operativo y versión de Python
      placeholder: "Windows 11, Python 3.12 / Ubuntu, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: detalles
    attributes:
      label: Información adicional
      description: Mensaje de error o captura sin datos de alumnos.
